<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Global Data Register</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      background-color: #0b0e14;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
    }
    
    /* Top Ticker Bar */
    .ticker-wrap {
      background: #8e1519;
      color: #fff;
      height: 26px;
      display: flex;
      align-items: center;
      overflow: hidden;
      font-size: 10.5px;
      font-weight: bold;
      flex-shrink: 0;
      border-bottom: 1px solid #b31d23;
      position: relative;
    }
    .ticker-title {
      background: #000;
      color: #f85149;
      padding: 0 10px;
      height: 100%;
      display: flex;
      align-items: center;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 10;
      flex-shrink: 0;
    }
    .ticker-container {
      flex: 1;
      overflow: hidden;
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }
    
    /* JS DYNAMIC SCROLLING TRACK */
    .ticker-track {
      display: flex;
      white-space: nowrap;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      will-change: transform;
    }
    .ticker-content {
      display: flex;
      white-space: nowrap;
      padding-right: 60px;
    }

    /* Header Bar */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 4px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
      flex-shrink: 0;
    }
    .title-group { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 8px; height: 8px; background: #3fb950;
      border-radius: 50%; box-shadow: 0 0 6px #3fb950;
      animation: pulse 1.5s infinite;
    }
    h1 { color: #f85149; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

    /* Main Viewport */
    .app-viewport {
      height: calc(100dvh - 62px);
      width: 100vw;
      display: flex;
    }

    /* Left Sidebar Navigation */
    nav.side-menu {
      width: 230px;
      background: #11151c;
      border-right: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
      flex-shrink: 0;
      height: 100%;
      overflow: hidden;
    }
    .side-menu-header {
      font-size: 8.5px;
      font-weight: bold;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      margin-bottom: 2px;
      padding-left: 4px;
    }
    .menu-item {
      height: 34px;
      padding: 0 10px;
      font-size: 9.5px;
      color: #8b949e;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .menu-item:hover { border-color: #8b949e; color: #c9d1d9; }
    .menu-item.active {
      background: rgba(248, 81, 73, 0.12);
      color: #f85149;
      border-color: #f85149;
      box-shadow: 0 0 8px rgba(248, 81, 73, 0.2);
    }

    /* Sidebar Section Divider */
    .sidebar-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #30363d 20%, #30363d 80%, transparent);
      margin: 4px 0;
      flex-shrink: 0;
    }

    /* Sidebar News Feed */
    .sidebar-news-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 6px;
      overflow: hidden;
    }
    .news-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
    .news-card { background: #161b22; border: 1px solid #21262d; padding: 4px 6px; border-radius: 4px; font-size: 8px; line-height: 1.3; cursor: pointer; }
    .news-time { color: #f85149; font-size: 7px; font-weight: bold; }
    .news-time-green { color: #3fb950; font-size: 7px; font-weight: bold; }
    .news-time-yellow { color: #d29922; font-size: 7px; font-weight: bold; }

    /* Stage Container */
    .stage-container {
      width: calc(100vw - 230px);
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* LEAFLET TACTICAL MAP CONTAINER */
    #leafletMap {
      flex: 1;
      width: 100%;
      background: #090d14;
      min-height: 0;
    }
    .leaflet-container { background: #090d14 !important; }
    .leaflet-control-attribution { display: none !important; }

    /* CUSTOM LEAFLET DIV MARKERS */
    .leaflet-marker-icon { background: none; border: none; }
    .map-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }
    .map-marker:hover { transform: scale(1.25); }

    .marker-conflict {
      background: rgba(248, 81, 73, 0.25);
      border: 1.5px solid #f85149;
      color: #f85149;
      box-shadow: 0 0 12px #f85149;
      animation: ping 2s infinite;
    }
    .marker-disaster {
      background: rgba(63, 185, 80, 0.25);
      border: 1.5px solid #3fb950;
      color: #3fb950;
      box-shadow: 0 0 12px #3fb950;
    }
    .marker-persecution {
      background: rgba(210, 153, 34, 0.25);
      border: 1.5px solid #d29922;
      color: #d29922;
      box-shadow: 0 0 12px #d29922;
    }

    /* DOCKED BOTTOM DASHBOARD PANEL - EVENLY SPLIT TELEMETRY AND RADAR */
    .dashboard-grid {
      height: 140px;
      width: 100%;
      display: grid;
      grid-template-columns: 190px 1fr 1fr;
      gap: 6px;
      padding: 5px 8px;
      background: #0d1117;
      border-top: 1px solid #30363d;
      flex-shrink: 0;
      z-index: 100;
    }

    .panel-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      font-size: 8.5px;
      font-weight: bold;
      color: #8b949e;
      text-transform: uppercase;
      border-bottom: 1px solid #21262d;
      padding-bottom: 2px;
      margin-bottom: 3px;
    }

    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; flex: 1; }
    .metric-card { background: #0d1117; border: 1px solid #21262d; border-radius: 4px; padding: 2px 5px; display: flex; flex-direction: column; justify-content: center; }
    .metric-card .count { font-size: 13px; font-weight: bold; }
    .metric-card .label { font-size: 6.5px; color: #8b949e; text-transform: uppercase; }

    .threat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .badge { padding: 1px 4px; border-radius: 3px; font-size: 8px; font-weight: bold; border: 1px solid; }
