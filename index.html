<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Global Data Register</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      background-color: #0b0e14;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
    }

    /* Header Bar */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 4px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
      flex-shrink: 0;
    }
    .title-group { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 8px; height: 8px; background: #388bfd;
      border-radius: 50%; box-shadow: 0 0 6px #388bfd;
      animation: pulse 1.5s infinite;
    }
    h1 { color: #58a6ff; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

    /* Main Viewport */
    .app-viewport {
      height: calc(100dvh - 36px);
      width: 100vw;
      display: flex;
    }

    /* Left Sidebar Navigation */
    nav.side-menu {
      width: 240px;
      background: #11151c;
      border-right: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 5px;
      flex-shrink: 0;
      height: 100%;
      overflow: hidden;
    }
    .side-menu-header {
      font-size: 8.5px;
      font-weight: bold;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      margin-bottom: 2px;
      padding-left: 4px;
    }
    .menu-item {
      height: 28px;
      padding: 0 10px;
      font-size: 8.5px;
      color: #8b949e;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .menu-item:hover { border-color: #8b949e; color: #c9d1d9; }
    .menu-item.active {
      background: rgba(88, 166, 255, 0.12);
      color: #58a6ff;
      border-color: #58a6ff;
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.2);
    }

    /* Sidebar Section Divider */
    .sidebar-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #30363d 20%, #30363d 80%, transparent);
      margin: 4px 0;
      flex-shrink: 0;
    }

    /* Sidebar Telemetry Feed */
    .sidebar-news-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 6px;
      overflow: hidden;
    }
    .news-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
    .news-card { background: #161b22; border: 1px solid #21262d; padding: 4px 6px; border-radius: 4px; font-size: 8px; line-height: 1.3; cursor: pointer; }

    /* Stage Container */
    .stage-container {
      width: calc(100vw - 240px);
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* LEAFLET MAP CONTAINER */
    #leafletMap {
      flex: 1;
      width: 100%;
      background: #090d14;
      min-height: 0;
    }
    .leaflet-container { background: #090d14 !important; }
    .leaflet-control-attribution { display: none !important; }

    /* CUSTOM HOVER TOOLTIP STYLING */
    .leaflet-tooltip.custom-state-tooltip {
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 9px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="title-group">
        <div class="status-dot"></div>
        <h1>Global Data Register</h1>
      </div>
      <div class="header-actions">
        <span style="font-size:9.5px; color:#388bfd;">REGISTER FEED ACTIVE</span>
      </div>
    </header>

    <div class="app-viewport">
      <nav class="side-menu">
        <div class="side-menu-header">REGISTER DOMAINS</div>
        <div class="menu-item active" onclick="filterCategory('ALL', this)">🌐 All Global Nodes</div>
        <div class="menu-item" onclick="filterCategory('active', this)">🔵 Active Nodes</div>
        <div class="menu-item" onclick="filterCategory('pending', this)">🟡 Pending Verification</div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-news-container">
          <div class="side-menu-header" style="margin-top:0;">TELEMETRY FEED</div>
          <div id="region-title" style="color:#58a6ff; font-size: 9px; font-weight:bold; margin-bottom: 1px;">Global Summary</div>
          <div id="region-coords" style="font-size:7px; color:#8b949e; margin-bottom: 4px;">System Telemetry Log</div>
          <div id="news-feed" class="news-list"></div>
        </div>
      </nav>

      <div class="stage-container">
        <div id="leafletMap"></div>
      </div>
    </div>
  </div>

  <script>
    let map;
    let geojsonLayer;
    let currentActiveCategory = 'ALL';

    // REGULAR GLOBAL REGISTER DATASET (WITH STRING MATCHING MAPPINGS)
    let registerData = [
      { id: "us", name: "United States of America", displayName: "United States", status: "Active Node", color: "#388bfd", desc: "North American Regional Core Node." },
      { id: "ca", name: "Canada", displayName: "Canada", status: "Active Node", color: "#388bfd", desc: "Northern Secondary Relay Node." },
      { id: "mx", name: "Mexico", displayName: "Mexico", status: "Active Node", color: "#388bfd", desc: "Central America Transit Hub." },
      { id: "br", name: "Brazil", displayName: "Brazil", status: "Pending Verification", color: "#d29922", desc: "South America Telemetry Pipeline." },
      { id: "uk", name: "United Kingdom", displayName: "United Kingdom", status: "Active Node", color: "#388bfd", desc: "European Primary Data Center." },
      { id: "de", name: "Germany", displayName: "Germany", status: "Active Node", color: "#388bfd", desc: "Central European Infrastructure Hub." },
      { id: "jp", name: "Japan", displayName: "Japan", status: "Active Node", color: "#388bfd", desc: "East Asia Pacific Backbone." },
      { id: "au", name: "Australia", displayName: "Australia", status: "Pending Verification", color: "#d29922", desc: "Oceania Edge Network Node." }
    ];

    function findRegisterItem(rawName) {
      if (!rawName) return null;
      const normalized = rawName.trim().toLowerCase();
      return registerData.find(d => 
        d.name.toLowerCase() === normalized || 
        d.displayName.toLowerCase() === normalized ||
        normalized.includes(d.id)
      );
    }

    function getFeatureColor(name) {
      const item = findRegisterItem(name);
      return item ? item.color : '#21262d';
    }

    function styleFeature(feature) {
      return {
        fillColor: getFeatureColor(feature.properties.name),
        weight: 1.5,
        opacity: 0.9,
        color: '#30363d',
        fillOpacity: 0.55
      };
    }

    function highlightFeature(e) {
      const layer = e.target;
      layer.setStyle({
        weight: 3,
        color: '#58a6ff',
        fillOpacity: 0.75
      });
    }

    function resetFeatureHighlight(e) {
      if (geojsonLayer) {
        geojsonLayer.resetStyle(e.target);
      }
    }

    function onFeatureClick(e) {
      const name = e.target.feature.properties.name;
      const item = findRegisterItem(name);
      if (item) {
        selectRegisterItem(item);
      }
    }

    // HOVER TOOLTIP IMPLEMENTATION
    function onEachFeature(feature, layer) {
      const rawName = feature.properties.name || "Region";
      const item = findRegisterItem(rawName);
      
      let tooltipText = `<b>${item ? item.displayName : rawName}</b>`;
      if (item) {
        tooltipText += `<br/><span style="color:${item.color}">${item.status}</span>`;
      } else {
        tooltipText += `<br/><span style="color:#8b949e">Global Data Register Node</span>`;
      }
      
      layer.bindTooltip(tooltipText, {
        className: 'custom-state-tooltip',
        direction: 'auto',
        sticky: true
      });

      layer.on({
        mouseover: highlightFeature,
        mouseout: resetFeatureHighlight,
        click: onFeatureClick
      });
    }

    function initMap() {
      map = L.map('leafletMap', {
        center: [20, 0],
        zoom: 2,
        minZoom: 2,
        maxZoom: 6,
        zoomControl: false
      });

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(map);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(map);

      fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
        .then(res => res.json())
        .then(worldData => {
          geojsonLayer = L.geoJson(worldData, {
            style: styleFeature,
            onEachFeature: onEachFeature
          }).addTo(map);
        })
        .catch(err => console.error("Global GeoJSON Load Error:", err));

      loadNewsFeed();
    }

    function selectRegisterItem(item) {
      const titleEl = document.getElementById('region-title');
      if (titleEl) {
        titleEl.textContent = item.displayName;
        titleEl.style.color = item.color;
      }

      const coordsEl = document.getElementById('region-coords');
      if (coordsEl) coordsEl.textContent = item.status;

      const newsFeed = document.getElementById('news-feed');
      if (newsFeed) {
        newsFeed.innerHTML = `
          <div class="news-card">
            <span style="color:${item.color}; font-weight:bold;">[${item.status}]</span>
            <p style="margin-top:2px; color:#c9d1d9;">${item.desc}</p>
          </div>
        `;
      }
    }

    function loadNewsFeed() {
      const newsFeed = document.getElementById('news-feed');
      if (!newsFeed) return;

      newsFeed.innerHTML = registerData.map(item => `
        <div class="news-card" onclick='selectRegisterItem(${JSON.stringify(item)})'>
          <span style="color:${item.color}; font-weight:bold;">[${item.displayName}]</span>
          <p style="margin-top:1px; color:#c9d1d9;">${item.desc}</p>
        </div>
      `).join('');
    }

    function filterCategory(category, element) {
      currentActiveCategory = category;
      document.querySelectorAll('.side-menu .menu-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
    }

    window.addEventListener('load', () => {
      initMap();
    });
  </script>
</body>
</html>
